/**:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. Параметры сенсора и сетевой подписки (LiDAR & QoS)
    # --------------------------------------------------------------------------
    lidar_topic: "/lidar_points"
    target_frame: "hesai_lidar"
    qos_reliability: "reliable"

    # --------------------------------------------------------------------------
    # 2. Параметры вокселизации пространства (Voxel Grid Resolution)
    # --------------------------------------------------------------------------
    # Латеральный шаг вокселя (метры, 10 см для четкой локализации стен и рельсов):
    voxel_size_x: 0.10

    # Продольный шаг вокселя (метры, 20 см вдоль движения):
    voxel_size_y: 0.20

    # Вертикальный шаг вокселя (метры, 5 см для точного отделения УГР от балласта и лотка):
    voxel_size_z: 0.05

    # Минимальное число точек лидара в вокселе:
    min_points_per_voxel: 1

    # --------------------------------------------------------------------------
    # 3. Продольная дискретизация и горизонт видимости (Lookahead & Slicing)
    # --------------------------------------------------------------------------
    lookahead_distance: 180.0
    min_distance: 2.5
    slice_step: 2.2
    zone1_start: 35.5
    zone2_start: 79.5
    curvature_freeze_dist: 75.0

    # --------------------------------------------------------------------------
    # 4. Железнодорожные нормативы и кинематические ограничения (Track Constraints)
    # --------------------------------------------------------------------------
    track_corridor_half_width: 0.85
    clearance_corridor_half_width: 1.75
    single_tunnel_radius: 2.15
    min_curve_radius: 160.0
    max_grade_slope: 0.035
    default_rail_z: -1.35
    gauge: 1.520
    max_heading_slope: 0.45
    temporal_alpha: 0.50

    # --------------------------------------------------------------------------
    # 5. Параметры поиска рельсов и УГР по вокселям (Rail Head & Bed)
    # --------------------------------------------------------------------------
    rail_search_tolerance: 0.16
    rail_z_min_offset: -0.35
    rail_z_max_offset: 0.30
    rail_head_quantile: 0.85
    track_bed_quantile: 0.85
    rail_height_over_bed: 0.16
    min_rail_voxels: 2

    # --------------------------------------------------------------------------
    # 6. Универсальные форма-инвариантные границы тоннеля (Shape-Agnostic Walls)
    # --------------------------------------------------------------------------
    wall_search_min_dist: 1.25
    wall_search_max_dist: 4.20
    wall_z_min: 0.35
    wall_z_max: 3.80
    left_wall_quantile: 0.90
    right_wall_quantile: 0.10
    min_wall_voxels_near: 3
    min_wall_voxels_far: 2
    wall_near_threshold: 45.0
    symmetric_tunnel_min_width: 3.0
    symmetric_tunnel_max_width: 5.4
    symmetric_tunnel_wall_tolerance: 1.2
    wall_tracking_error_tolerance: 0.70
    single_wall_tolerance: 0.85

    # --------------------------------------------------------------------------
    # 7. Контроль свободности габарита подвижного состава (ГОСТ 9238)
    # --------------------------------------------------------------------------
    clearance_envelope_topic: "/metro/clearance_envelope"
    rail_head_clearance: 0.18
    undercarriage_half_width: 1.15
    contact_rail_height: 0.60
    platform_clearance_half_width: 1.33
    platform_height: 1.25
    waist_half_width: 1.37
    carriage_wall_height: 2.60
    roof_half_width: 0.85
    carriage_height: 3.60
    envelope_alpha: 0.18

    # --------------------------------------------------------------------------
    # 8. Параметры кластеризации препятствий (Obstacle Extraction)
    # --------------------------------------------------------------------------
    min_cluster_voxels: 3
    cluster_distance_thresh: 0.45

/**:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. Параметры сенсора и сетевой подписки (LiDAR & QoS)
    # --------------------------------------------------------------------------
    # Имя топика сырого облака точек PointCloud2:
    # - Для 5 бэгов с Hesai 128: "/lidar_points"
    # - Для бэга с Livox ("doubleT_obstacle"): "/sensing/lidar/hesai128/pointcloud"
    lidar_topic: "/lidar_points"

    # Базовая система координат сенсора ("hesai_lidar" или "lidar_livox"):
    target_frame: "hesai_lidar"

    # Политика надежности QoS ("reliable" для ros2 bag play, "best_effort" для реального сенсора):
    qos_reliability: "reliable"

    # --------------------------------------------------------------------------
    # 2. Продольная дискретизация и горизонт видимости (Lookahead & Slicing)
    # --------------------------------------------------------------------------
    # Горизонт трассировки пути вперед по ходу движения (метры, до 180-200м):
    lookahead_distance: 180.0

    # Ближняя мертвая зона перед лидаром (сцепка/капот поезда, метры):
    min_distance: 2.5

    # Продольный шаг нарезки пространства тоннеля на срезы вдоль траектории (метры):
    slice_step: 1.2

    # Дистанция перехода в среднюю зону (шаг среза удваивается: slice_step * 2 = 4.4 м):
    zone1_start: 35.5

    # Дистанция перехода в дальнюю зону (шаг среза учетверяется: slice_step * 4 = 8.8 м):
    zone2_start: 79.5

    # Дистанция, дальше которой замораживается обновление кривизны (обновляется только азимут heading):
    # Предотвращает раскачку траектории на предельных дальностях из-за разреженности точек:
    curvature_freeze_dist: 180.0

    # --------------------------------------------------------------------------
    # 3. Железнодорожные нормативы и удержание траектории (Track Constraints)
    # --------------------------------------------------------------------------
    # Полуширина зоны поиска рельсовых нитей и балластной призмы (|u| <= 0.85 м, колея 1520 мм):
    track_corridor_half_width: 0.85

    # Полуширина габаритного коридора тоннеля по ГОСТ 9238 для визуализации маркеров (метры):
    clearance_corridor_half_width: 1.75

    # Номинальный внутренний полугабарит однопутного тоннеля метро (метры, радиус R = 2.15 м):
    single_tunnel_radius: 2.15

    # Минимальный нормативный радиус кривых путей метрополитена по СП 120.13330 (метры, R >= 160 м):
    min_curve_radius: 10.0

    # Предельный продольный уклон профиля пути по ПТЭ метрополитенов (35 тысячных = 0.035 / 3.5%):
    max_grade_slope: 0.035

    # Начальная проектная отметка головки рельса при старте ноды в СК лидара (метры):
    default_rail_z: -1.35

    # Ширина русской железнодорожной колеи метрополитенов РФ (метры, 1520 мм):
    gauge: 1.520

    # Максимальный допустимый тангенс угла рыскания пути относительно продольной оси сенсора:
    max_heading_slope: 0.45

    # Коэффициент экспоненциального сглаживания EMA траектории по кадрам (0.0 - 1.0):
    # 1.0 = мгновенная обработка каждого кадра без задержки на поворотах
    # 0.3 - 0.5 = робастная фильтрация дрожания при движении
    temporal_alpha: 0.35

    # --------------------------------------------------------------------------
    # 4. Параметры адаптивного поиска рельсов и определения УГР (Rail & Track Bed)
    # --------------------------------------------------------------------------
    # Допуск поиска головки рельса по ширине в адаптивных координатах (|u - rail_x| <= tol, метры):
    rail_search_tolerance: 0.16

    # Нижнее смещение вертикального окна поиска рельсов относительно z_pred (метры):
    rail_z_min_offset: -0.35

    # Верхнее смещение вертикального окна поиска рельсов относительно z_pred (метры):
    rail_z_max_offset: 0.30

    # Квантиль распределения высот для головок рельсов (отсекает подошву и грязь лотка):
    rail_head_quantile: 0.85

    # Квантиль распределения высот для балластного лотка (используется при плохой видимости головок):
    track_bed_quantile: 0.85

    # Конструктивная разница высот между головкой рельса и дном водоотводного лотка (метры):
    rail_height_over_bed: 0.16

    # Минимальное число точек в створе рельса/лотка для признания измерения достоверным:
    min_rail_points: 3

    # --------------------------------------------------------------------------
    # 5. Параметры робастного поиска стен тоннеля (Tunnel Walls & Boundaries)
    # --------------------------------------------------------------------------
    # Минимальное расстояние от оси пути до стены тоннеля (отсекает кабели, контактный рельс, платформы):
    wall_search_min_dist: 1.0

    # Максимальное расстояние поиска стены тоннеля (для однопутных и двухпутных участков, метры):
    wall_search_max_dist: 5.20

    # Нижняя граница поиска стен над уровнем головки рельса (УГР, метры):
    wall_z_min: 0.5

    # Верхняя граница поиска стен над уровнем головки рельса (УГР, метры):
    wall_z_max: 3.00

    # Квантиль для определения внутренней поверхности левой стены (0.90 = ближняя к пути грань тюбингов):
    left_wall_quantile: 0.90

    # Квантиль для определения внутренней поверхности правой стены (0.10 = ближняя к пути грань тюбингов):
    right_wall_quantile: 0.10

    # Минимальное количество точек стены для ближней зоны (< wall_near_threshold):
    min_wall_points_near: 4

    # Минимальное количество точек стены для дальней зоны (разреженное облако):
    min_wall_points_far: 1

    # Граничная дистанция между ближней и дальней зоной детекции стен (метры):
    wall_near_threshold: 45.0

    # Минимальная ширина симметричного тоннеля (метры, D_min = 3.0 м):
    symmetric_tunnel_min_width: 3.0

    # Максимальная ширина симметричного однопутного тоннеля (метры, D_max = 5.4 м):
    symmetric_tunnel_max_width: 5.4

    # Допустимая асимметрия стен для применения симметричного центрирования (метры):
    symmetric_tunnel_wall_tolerance: 1.2

    # Допустимая погрешность следования за непрерывной стеной на асимметричных участках (метры):
    wall_tracking_error_tolerance: 0.50

    # Допустимая погрешность следования за единственной видимой стеной на сильных поворотах (метры):
    single_wall_tolerance: 0.5

    # --------------------------------------------------------------------------
    # 6. Фильтрация сырого облака точек (Raw Cloud Pre-filtering)
    # --------------------------------------------------------------------------
    # Максимальное боковое отклонение точек от оси лидара (|X| <= max_lateral_offset, метры):
    # Достаточно велико (12-15 м), чтобы не срезать криволинейный тоннель на дальних дистанциях:
    max_lateral_offset: 20.0

    # --------------------------------------------------------------------------
    # 7. Точная 3D-форма зоны детекции препятствий и силуэта вагона (ГОСТ 9238)
    # --------------------------------------------------------------------------
    # Топик для публикации MarkerArray силуэта вагона и зоны контроля свободности:
    clearance_envelope_topic: "/metro/clearance_envelope"

    # Безопасный вертикальный зазор над головкой рельса (УГР, метры):
    # Соответствует нижней кромке метельника/подвагонного оборудования по ГОСТ 9238:
    # Исключает попадание рельсовых нитей, накладок, скреплений и шпал в зону препятствий:
    rail_head_clearance: 0.15

    # Полуширина подвагонного габарита до зоны контактного рельса (метры, полная ширина 2.30 м):
    # Покрывает рельсы (X = +-0.76 м), но проходит строго внутри контактного рельса (X >= 1.25 м):
    undercarriage_half_width: 1.15

    # Высота зоны контактного рельса над УГР (метры, защитный короб КР заканчивается на +0.40 м):
    contact_rail_height: 0.60

    # Полуширина вагона на уровне платформы (|X| <= 1.33 м, полная ширина 2.66 м):
    # Соответствует реальному кузову вагона 81-765 (2686 мм) и оставляет зазор 7 см до платформы (X = 1.40 м):
    platform_clearance_half_width: 1.33

    # Верхняя отметка уровня высокой платформы станции над УГР (метры, платформа = 1.10 м):
    platform_height: 1.25

    # Полуширина кузова вагона по подоконному поясу выше платформы (метры, полная ширина 2.74 м):
    waist_half_width: 1.37

    # Высота вертикальной стенки кузова вагона до ската крыши (метры от УГР):
    carriage_wall_height: 2.60

    # Полуширина верха купола крыши вагона (метры, верхняя площадка шириной 1.70 м):
    roof_half_width: 0.85

    # Полная габаритная высота вагона от головки рельса УГР (метры):
    carriage_height: 3.60

    # Прозрачность полупрозрачного 3D-объема габарита вагона в Foxglove Studio (0.0 - 1.0):
    envelope_alpha: 0.18

